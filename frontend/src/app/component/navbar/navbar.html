<!-- TOP HEADER NAVIGATION -->
<header class="app-header">
  <div class="header-container">
    <!-- Left Zone: Logo & Main Navigation Links -->
    <div class="header-left">
      <!-- Mobile menu trigger -->
      <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Brand Logo -->
      <a routerLink="/landing-page" class="brand-logo" aria-label="Tedbus Homepage">
        <img class="logo-img" src="assets/bus-logo.avif" alt="Tedbus Logo"/>
        <span class="brand-text">tedbus</span>
      </a>

      <!-- Desktop Primary Navigation -->
      <nav class="desktop-nav">
        <a routerLink="/landing-page" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <i class="fa-solid fa-bus nav-icon"></i>
          <span>Bus Tickets</span>
        </a>
        <a routerLink="/cab-book" routerLinkActive="active-nav-link" class="nav-item">
          <i class="fa-solid fa-taxi nav-icon"></i>
          <span>Cab Rental</span>
        </a>
        <a routerLink="/trains" routerLinkActive="active-nav-link" class="nav-item">
          <i class="fa-solid fa-train nav-icon"></i>
          <span>Train Tickets</span>
        </a>
      </nav>
    </div>

    <!-- Right Zone: Theme Toggle, Google Sign In, Community, Help & Account -->
    <div class="header-right">
      <!-- Theme Toggle Button (Sun / Moon) -->
      <button (click)="themeService.toggleTheme()" 
              class="theme-toggle-btn"
              [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
              [title]="themeService.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'">
        <i class="fa-solid fa-sun text-amber-400" *ngIf="themeService.isDarkMode()"></i>
        <i class="fa-solid fa-moon text-indigo-400" *ngIf="!themeService.isDarkMode()"></i>
      </button>

      <!-- Google Sign In Button (Logged Out) -->
      <div id="google-btn" *ngIf="!isloggedIn" class="google-auth-slot"></div>

      <!-- Logged In Links & Account -->
      <ng-container *ngIf="isloggedIn">
        <a routerLink="/community" routerLinkActive="active-nav-link" class="nav-pill-btn">
          <i class="fa-solid fa-earth-americas text-brand"></i>
          <span class="hidden sm:inline">Community Hub</span>
        </a>

        <a routerLink="/help" routerLinkActive="active-nav-link" class="nav-pill-btn">
          <i class="fa-solid fa-circle-question text-brand"></i>
          <span class="hidden sm:inline">Help</span>
        </a>

        <!-- Account Dropdown Menu Button -->
        <button class="account-menu-trigger" [matMenuTriggerFor]="accountMenu" aria-label="User Account Menu">
          <img *ngIf="user?.picture" [src]="user?.picture" class="user-avatar" alt="Profile avatar"/>
          <i *ngIf="!user?.picture" class="fa-regular fa-circle-user avatar-fallback"></i>
          <span class="user-display-name">{{ user?.name || 'Account' }}</span>
          <i class="fa-solid fa-chevron-down caret-icon"></i>
        </button>

        <mat-menu #accountMenu="matMenu" class="tedbus-menu">
          <button mat-menu-item (click)="navigate('/account')">
            <i class="fa-regular fa-user mr-2 text-brand"></i>
            <span>My Profile & Bookings</span>
          </button>

          <button mat-menu-item (click)="navigate('/help')">
            <i class="fa-solid fa-headset mr-2 text-brand"></i>
            <span>Help & Support</span>
          </button>

          <!-- Theme Submenu / Preferences -->
          <div class="menu-divider"></div>
          <div class="menu-section-title">Theme</div>
          <button mat-menu-item (click)="setSpecificTheme('light')">
            <i class="fa-solid fa-sun mr-2 text-amber-500"></i>
            <span>Light</span>
          </button>
          <button mat-menu-item (click)="setSpecificTheme('dark')">
            <i class="fa-solid fa-moon mr-2 text-indigo-400"></i>
            <span>Dark</span>
          </button>
          <button mat-menu-item (click)="setSpecificTheme('system')">
            <i class="fa-solid fa-circle-half-stroke mr-2 text-muted"></i>
            <span>System Default</span>
          </button>

          <div class="menu-divider"></div>
          <button mat-menu-item (click)="signOut()" class="text-danger">
            <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
</header>

<!-- MOBILE DRAWER MENU OVERLAY -->
<div class="mobile-drawer-backdrop" *ngIf="showMobileMenu" (click)="toggleMobileMenu()"></div>
<aside class="mobile-drawer" [class.open]="showMobileMenu">
  <div class="drawer-header">
    <div class="brand-logo">
      <img class="logo-img" src="assets/bus-logo.avif" alt="Tedbus Logo"/>
      <span class="brand-text">tedbus</span>
    </div>
    <button class="drawer-close-btn" (click)="toggleMobileMenu()" aria-label="Close menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <nav class="drawer-links">
    <a routerLink="/landing-page" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-bus text-brand"></i>
      <span>Bus Tickets</span>
    </a>
    <a routerLink="/cab-book" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-taxi text-brand"></i>
      <span>Cab Rental</span>
    </a>
    <a routerLink="/trains" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-train text-brand"></i>
      <span>Train Tickets</span>
    </a>
    <a routerLink="/custom-bus" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-van-shuttle text-brand"></i>
      <span>Custom Bus</span>
    </a>
    <a routerLink="/community" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-earth-americas text-brand"></i>
      <span>Community Hub</span>
    </a>
    <a routerLink="/help" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-circle-question text-brand"></i>
      <span>Help & FAQs</span>
    </a>
    <a routerLink="/account" (click)="toggleMobileMenu()" class="drawer-link">
      <i class="fa-solid fa-user text-brand"></i>
      <span>My Profile & Trips</span>
    </a>
  </nav>

  <div class="drawer-footer" *ngIf="isloggedIn">
    <button class="btn-secondary w-full" (click)="signOut(); toggleMobileMenu()">
      <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>
      <span>Sign Out</span>
    </button>
  </div>
</aside>

<!-- MOBILE BOTTOM NAVIGATION (Appears on screens < 768px) -->
<nav class="mobile-bottom-nav">
  <a routerLink="/landing-page" routerLinkActive="active-bottom-item" [routerLinkActiveOptions]="{exact: true}" class="bottom-nav-item">
    <i class="fa-solid fa-bus bottom-icon"></i>
    <span>Bus</span>
  </a>
  <a routerLink="/cab-book" routerLinkActive="active-bottom-item" class="bottom-nav-item">
    <i class="fa-solid fa-taxi bottom-icon"></i>
    <span>Cab</span>
  </a>
  <a routerLink="/trains" routerLinkActive="active-bottom-item" class="bottom-nav-item">
    <i class="fa-solid fa-train bottom-icon"></i>
    <span>Train</span>
  </a>
  <a routerLink="/community" routerLinkActive="active-bottom-item" class="bottom-nav-item">
    <i class="fa-solid fa-earth-americas bottom-icon"></i>
    <span>Community</span>
  </a>
  <a routerLink="/account" routerLinkActive="active-bottom-item" class="bottom-nav-item">
    <i class="fa-solid fa-user bottom-icon"></i>
    <span>Account</span>
  </a>
</nav>
