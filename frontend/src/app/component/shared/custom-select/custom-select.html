<div class="custom-select-container">
  <!-- Trigger Segment (Matches From/To Style) -->
  <div class="select-trigger" (click)="toggleOpen()" [class.active]="isOpen" tabindex="0" (keydown.enter)="toggleOpen()">
    <div class="trigger-label">
      <i [class]="icon" class="trigger-icon"></i>
      <span>{{ label }}</span>
    </div>
    <div class="trigger-value-row">
      <span class="trigger-value">{{ selectedOption?.label || selectedCode }}</span>
      <i class="fa-solid fa-chevron-down chevron-icon" [class.rotated]="isOpen"></i>
    </div>
  </div>

  <!-- Popover Options Listbox -->
  <div class="select-popover" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="options-listbox" role="listbox">
      <button
        *ngFor="let opt of options"
        type="button"
        class="option-row"
        [class.selected]="opt.code === selectedCode || opt.label === selectedCode"
        (click)="select(opt)"
        role="option"
        [attr.aria-selected]="opt.code === selectedCode || opt.label === selectedCode"
      >
        <div class="option-text-group">
          <span class="option-main">{{ opt.label }}</span>
          <span class="option-desc" *ngIf="opt.desc">{{ opt.desc }}</span>
        </div>
        <i class="fa-solid fa-check check-icon" *ngIf="opt.code === selectedCode || opt.label === selectedCode"></i>
      </button>
    </div>
  </div>
</div>
