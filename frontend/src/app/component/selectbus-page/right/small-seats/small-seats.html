<div class="seat-tile"
     [class.booked]="alreadybookedseats.includes(seatno)"
     [class.selected]="selectedseats.includes(seatno)"
     [class.ladies]="(seatno === 5 || seatno === 6) && !alreadybookedseats.includes(seatno) && !selectedseats.includes(seatno)"
     (click)="handleseatbooking(seatno)"
     [attr.title]="alreadybookedseats.includes(seatno) ? 'Seat ' + seatno + ' (Booked)' : 'Seat ' + seatno + (selectedseats.includes(seatno) ? ' (Selected)' : ' (Available)')">
  <span class="seat-number">{{ seatno }}</span>
  <i class="fa-solid fa-check check-icon" *ngIf="selectedseats.includes(seatno)"></i>
  <i class="fa-solid fa-ban booked-icon" *ngIf="alreadybookedseats.includes(seatno)"></i>
</div>
