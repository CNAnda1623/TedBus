<div class="passenger-form-module">
  <div class="form-section-header">
    <div class="header-icon"><i class="fa-solid fa-users text-[var(--brand-primary)]"></i></div>
    <div>
      <h4 class="form-title">Passenger Information</h4>
      <p class="form-subtitle">Enter details for all reserved seat travelers</p>
    </div>
  </div>

  <!-- Dynamic Passenger Cards for each seat -->
  <div class="passengers-cards-list">
    <div *ngFor="let seat of selectedseat; let index = index" class="passenger-card-item">
      <div class="card-item-header">
        <span class="p-num font-bold text-xs uppercase text-[var(--text-secondary)]">Passenger {{ index + 1 }}</span>
        <span class="p-seat-pill font-bold text-xs text-[var(--brand-primary)]">Seat {{ seat }}</span>
      </div>

      <div class="form-row-grid">
        <div class="form-field-group name-field">
          <label class="field-label">Full Name</label>
          <input class="text-input" placeholder="e.g. Rahul Sharma" type="text"
            [value]="passdetails[index].name || ''"
            (input)="handlePassName($event, index)" required />
        </div>

        <div class="form-field-group age-field">
          <label class="field-label">Age</label>
          <input class="text-input" placeholder="28" type="number" min="1" max="110"
            [value]="passdetails[index].age || ''"
            (input)="handlePassAge($event, index)" required />
        </div>

        <div class="form-field-group gender-field">
          <label class="field-label">Gender</label>
          <div class="gender-segmented-control">
            <label class="segment-option">
              <input type="radio" [name]="'gender' + index" value="Male"
                [checked]="!passdetails[index] || passdetails[index].gender === 'Male'"
                (change)="handlePassGender($event, index)" />
              <span>Male</span>
            </label>
            <label class="segment-option">
              <input type="radio" [name]="'gender' + index" value="Female"
                [checked]="passdetails[index].gender === 'Female'"
                (change)="handlePassGender($event, index)" />
              <span>Female</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact & Delivery Details -->
  <div class="contact-details-box">
    <div class="contact-header">
      <i class="fa-regular fa-envelope text-[var(--brand-primary)] mr-1"></i>
      <span class="font-bold text-sm text-[var(--text-primary)]">Ticket Delivery Info</span>
    </div>
    <p class="text-xs text-[var(--text-secondary)] mb-3">Your m-ticket and live bus tracking link will be sent here</p>

    <div class="contact-inputs-grid">
      <div class="form-field-group">
        <label class="field-label">Email ID</label>
        <input class="text-input" placeholder="name@example.com" type="email" [(ngModel)]="passemail" required />
      </div>

      <div class="form-field-group">
        <label class="field-label">Mobile Number</label>
        <div class="phone-input-combo">
          <span class="country-prefix">+91</span>
          <input class="text-input phone-input" placeholder="9876543210" type="tel" maxlength="10" [(ngModel)]="passphn" required />
        </div>
      </div>
    </div>

    <!-- Checkboxes -->
    <div class="preferences-toggles">
      <label class="toggle-row">
        <input type="checkbox" [(ngModel)]="sendupdates" />
        <span>Send booking confirmation & live bus GPS tracking to WhatsApp</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" [(ngModel)]="passinsurance" />
        <span>Protect my trip with travel insurance (₹15 / passenger)</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" [(ngModel)]="passisbuisness" />
        <span>This is a business trip (Add GST invoice details later)</span>
      </label>
    </div>
  </div>

  <!-- Proceed to Payment CTA -->
  <div class="form-submit-row">
    <button type="button" class="btn-submit-proceed" (click)="handleproceedtopay()">
      <span>Proceed to Payment</span>
      <i class="fa-solid fa-arrow-right ml-2"></i>
    </button>
  </div>
</div>
