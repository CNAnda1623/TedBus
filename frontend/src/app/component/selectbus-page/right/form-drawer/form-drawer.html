<div class="form-drawer-wrapper">
  <button type="button" class="btn-proceed-to-book" [disabled]="selectedseat.length === 0" (click)="toggleForm()">
    <span>{{ showForm ? 'Hide Passenger Details' : 'Proceed to Book' }}</span>
    <i class="fa-solid" [class.fa-angle-up]="showForm" [class.fa-angle-down]="!showForm"></i>
  </button>

  <div *ngIf="selectedseat.length === 0" class="disabled-reason-hint">
    Select at least 1 seat to continue
  </div>

  <div *ngIf="showForm && selectedseat.length > 0" class="inline-passenger-form-drawer">
    <app-bus-booking-form [selectedseat]="selectedseat" [seatprice]="seatprice" [routedetails]="routedetails"
      [busid]="busid" [busarrivaltime]="busarrivaltime" [busdeparturetime]="busdeparturetime" [operatorname]="operatorname">
    </app-bus-booking-form>
  </div>
</div>
