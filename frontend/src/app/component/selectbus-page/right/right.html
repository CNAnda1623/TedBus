<div class="right-container">
  <app-sorting-bar 
    [busCount]="matchedbus.length"
    [departure]="departurevar"
    [arrival]="arrival"
    [activeSort]="activeSort"
    (sortChange)="handleSortChange($event)">
  </app-sorting-bar>

  <div class="buses-list">
    <ng-container *ngFor="let bus of matchedbus">
      <app-bus-box *ngIf="bus._id" 
        [rating]='bus.rating' 
        [busid]="bus._id" 
        [operatorname]="bus.operatorName" 
        [bustype]="bus.busType"
        [departuretime]="bus.departureTime" 
        [livetracking]="bus.liveTracking" 
        [reschedulable]="bus.reschedulable" 
        [filledseats]="getFilledSeats(bus._id)"
        [routedetails]="routes">
      </app-bus-box>
    </ng-container>

    <!-- Empty state -->
    <div *ngIf="matchedbus.length === 0" class="empty-state-card">
      <div class="empty-icon-wrap">
        <mat-icon class="empty-bus-icon">directions_bus</mat-icon>
      </div>
      <h3 class="empty-title">No Buses Available</h3>
      <p class="empty-desc">
        We couldn't find any direct buses between <strong>{{ departurevar || 'selected origin' }}</strong> and <strong>{{ arrival || 'destination' }}</strong> for this date.
      </p>
      <div class="empty-actions">
        <a routerLink="/" class="btn-search-again">Change Route or Date</a>
      </div>
    </div>
  </div>
</div>
