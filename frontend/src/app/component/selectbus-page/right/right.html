<div>
    <app-sorting-bar></app-sorting-bar>
    <ng-container *ngFor="let bus of matchedbus">
        <app-bus-box *ngIf="bus._id" [rating]='bus.rating' [busid]="bus._id" [operatorname]="bus.operatorName" [bustype]="bus.busType"
            [departuretime]="bus.departureTime" [livetracking]="bus.liveTracking" [reschedulable]="bus.reschedulable" [filledseats]="getFilledSeats(bus._id)"
            [routedetails]="routes">
        </app-bus-box>
    </ng-container>
    <div *ngIf="matchedbus.length === 0" class="p-8 text-center text-gray-500">
        No buses found for this route.
    </div>
</div>
